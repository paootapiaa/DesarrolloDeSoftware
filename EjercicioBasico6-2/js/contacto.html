    <main>
        <h2>Contacto</h2>
        <div class="form-wrapper">
            <form action="">
                <p>¿Tienes alguna pregunta? ¡Contáctanos!</p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" minlength="10" required placeholder="Escribe tu apellido y nombre">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Escribe tu email">

                <label for="mensaje">Mensaje:</label>
                <textarea name="mensaje" id="mensaje" required placeholder="Escribe tu mensaje o consulta sobre suplementacion..."></textarea>

                <button type="submit">Enviar</button>
            </form>
        </div>
    </main>
