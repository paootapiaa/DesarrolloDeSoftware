<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/EjercicioBasico6-2/css/estilos.css">
    <title>MiPrimerSitio</title>
</head>
<body class="wrapper">
    <header>
        <h1>POKEFIT SUPPLEMENTS</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="acerca.html">Acerca de</a>
            <a href="servicios.html">Productos</a>
            <a href="contacto.html">Contacto</a>
            <a href="registro.html" class="activo">Registro</a>
        </nav>
    </header>

    <main>
        <h2>Formulario de registro</h2>
        <p>Crea tu cuenta PokeFit y accede a descuentos exclusivos, asesoría nutricional gratuita y pedidos prioritarios.</p>

        <div class="form-wrapper">
            <form action="">
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" placeholder="Tu nombre">

                <label for="apellido">Apellido</label>
                <input type="text" name="apellido" id="apellido" placeholder="Tu apellido">

                <label for="correo">Correo electrónico</label>
                <input type="email" name="email" id="correo" placeholder="tucorreo@ejemplo.com">

                <label>Genero</label>
                <div class="radio-group">
                    <input type="radio" name="genero" id="masculino" value="masculino">
                    <label for="masculino">Masculino</label>

                    <input type="radio" name="genero" id="femenino" value="femenino">
                    <label for="femenino">Femenino</label>

                    <input type="radio" name="genero" id="otro" value="otro">
                    <label for="otro">Prefiero no decir</label>
                </div>

                <label for="pais">País de residencia</label>
                <select name="pais" id="pais">
                    <option value="">-- Selecciona un pais</option>
                    <option value="ecuador">Ecuador</option>
                    <option value="colombia">Colombia</option>
                    <option value="argentina">Argentina</option>
                    <option value="chile">Chile</option>
                </select>

                <label for="fechaNac">Fecha de nacimiento:</label>
                <input type="date" name="fechaNac" id="fechaNac">

                <label for="objetivo">Objetivo principal:</label>
                <select name="objetivo" id="objetivo">
                    <option value="">-- Selecciona tu objetivo --</option>
                    <option value="masa">Ganar masa muscular</option>
                    <option value="definicion">Definicion y perdida de grasa</option>
                    <option value="fuerza">Aumento de fuerza</option>
                    <option value="resistencia">Resistencia y cardio</option>
                    <option value="salud">Salud general y bienestar</option>
                </select>

                <button type="submit">Registrar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Apex Supplements. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
